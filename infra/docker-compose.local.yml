services:
  postgres:
    image: postgres:16
    container_name: oh-jjeom-oh-postgres
    environment:
      POSTGRES_DB: oh_jjeom_oh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: oh-jjeom-oh-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
