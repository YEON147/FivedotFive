stages:
  - build

build_backend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    # GitLab Variables에 저장한 아이디와 토큰으로 로그인
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
  script:
    # apps/server 폴더로 이동해서 이미지 빌드 및 푸시
    - docker build -t ghcr.io/$GHCR_USER/server-image:latest ./apps/server
    - docker push ghcr.io/$GHCR_USER/server-image:latest
  only:
    - master
    - develop