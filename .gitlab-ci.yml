stages:
  - build
  - deploy

build_backend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
    - |
      if [ "$CI_COMMIT_BRANCH" == "master" ]; then
        IMAGE_TAG="prod"
      elif [ "$CI_COMMIT_BRANCH" == "master-hotfix" ]; then
        IMAGE_TAG="hotfix"
      else
        IMAGE_TAG="dev"
      fi
    - docker build -t ghcr.io/$GHCR_USER/server-image:$IMAGE_TAG -f apps/server/Dockerfile .
    - docker push ghcr.io/$GHCR_USER/server-image:$IMAGE_TAG
  only:
    - develop 
    - master
    - master-hotfix

build_frontend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
    # 프론트엔드는 빌드할 때 백엔드 주소가 필요하므로 --build-arg를 넣어줍니다
    - |
      if [ "$CI_COMMIT_BRANCH" == "master" ]; then
        export IMAGE_TAG="prod"
      elif [ "$CI_COMMIT_BRANCH" == "master-hotfix" ]; then
        export IMAGE_TAG="hotfix"
      else
        export IMAGE_TAG="dev"
      fi
    - docker build 
      --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL"
      --build-arg NEXT_PUBLIC_NGROK_URL="$NEXT_PUBLIC_NGROK_URL"
      --build-arg NEXT_PUBLIC_NEIS_API_KEY="$NEIS_API_KEY"
      --build-arg NEXT_PUBLIC_NEIS_API_BASE_URL="$NEIS_API_BASE_URL"
      --build-arg BACKEND_REWRITE_TARGET="$BACKEND_REWRITE_TARGET"
      --build-arg NEXT_PUBLIC_ASSET_BASE_URL="$NEXT_PUBLIC_ASSET_BASE_URL"
      --build-arg NEXT_PUBLIC_OG_ENABLED="$NEXT_PUBLIC_OG_ENABLED"
      --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL"
      --build-arg NEXT_PUBLIC_IMAGE_REMOTE_HOSTS="$NEXT_PUBLIC_IMAGE_REMOTE_HOSTS"
      -t ghcr.io/$GHCR_USER/client-image:$IMAGE_TAG 
      -f apps/client/Dockerfile .
    - docker push ghcr.io/$GHCR_USER/client-image:$IMAGE_TAG
  only:
    - develop
    - master
    - master-hotfix

deploy_staging:
  stage: deploy
  # tags:
  #   - laptop
  script:
    - echo "현재 스테이징 서버(노트북) 공간 부족으로 수동 배포 모드로 전환합니다."
    - echo $GHCR_TOKEN | docker login ghcr.io -u $GHCR_USER --password-stdin
    - cd infra
    - export GHCR_USER=$GHCR_USER
    - export DB_USERNAME=$DB_USERNAME
    - export DB_PASSWORD=$DB_PASSWORD
    - export JWT_SECRET=$JWT_SECRET
    - export KAKAO_CLIENT_ID=$KAKAO_CLIENT_ID
    - export KAKAO_CLIENT_SECRET=$KAKAO_CLIENT_SECRET
    - export AWS_ACCESS_KEY=$AWS_ACCESS_KEY
    - export AWS_SECRET_KEY=$AWS_SECRET_KEY
    - export ADMIN_PASSWORD=$ADMIN_PASSWORD
    - export ADMIN2_USERNAME=$ADMIN2_USERNAME 
    - export ADMIN2_PASSWORD=$ADMIN2_PASSWORD 
    - export AWS_REGION=ap-northeast-2
    - export S3_BUCKET=five-dot-five
    - docker compose up -d postgres redis
    - export SERVER_IMAGE_TAG=dev
    - export CLIENT_IMAGE_TAG=dev
    - |
      if [ "$CI_COMMIT_BRANCH" == "master-hotfix" ]; then
        export SERVER_IMAGE_TAG=hotfix
        export CLIENT_IMAGE_TAG=hotfix
      else
        export SERVER_IMAGE_TAG=dev
        export CLIENT_IMAGE_TAG=dev
      fi
    - export GMS_KEY=$GMS_KEY
    - docker compose pull client backend-blue
    - docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --force-recreate client backend-blue caddy
  when: manual
  only:
    - develop
    - master-hotfix

deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    # EC2 접속을 위한 SSH 클라이언트 설치 및 키 등록
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$EC2_PEM_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    # EC2 서버에 원격 접속해서 실행할 명령어
    - ssh -o StrictHostKeyChecking=no ubuntu@$EC2_HOST "
        echo $GHCR_TOKEN | docker login ghcr.io -u $GHCR_USER --password-stdin &&
        cd /home/ubuntu/S14P31F205 &&
        git fetch origin master &&
        git checkout master &&
        git pull origin master &&
        cd infra &&
        export GHCR_USER=$GHCR_USER &&
        export DB_USERNAME=$DB_USERNAME &&
        export DB_PASSWORD=$DB_PASSWORD &&
        export JWT_SECRET=$JWT_SECRET &&
        export KAKAO_CLIENT_ID=$KAKAO_CLIENT_ID &&
        export KAKAO_CLIENT_SECRET=$KAKAO_CLIENT_SECRET &&
        export NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL &&
        export AWS_ACCESS_KEY=$AWS_ACCESS_KEY &&
        export AWS_SECRET_KEY=$AWS_SECRET_KEY &&
        export ADMIN_PASSWORD=$ADMIN_PASSWORD &&
        export ADMIN2_USERNAME=$ADMIN2_USERNAME &&
        export ADMIN2_PASSWORD=$ADMIN2_PASSWORD && 
        export MAIL_PASSWORD=$MAIL_PASSWORD &&
        export GMS_KEY=$GMS_KEY &&
        export AWS_REGION=ap-northeast-2 &&
        export S3_BUCKET=five-dot-five &&
        chmod +x deploy.sh &&
        export SERVER_IMAGE_TAG=prod &&
        export CLIENT_IMAGE_TAG=prod &&
        ./deploy.sh
      "
  only:
    - master