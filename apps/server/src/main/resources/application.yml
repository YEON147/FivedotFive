spring:
  application:
    name: oh-jjeom-oh
  data:
    redis:
      host: oh-jjeom-oh-redis
      port: 6379
  datasource:
    url: jdbc:postgresql://oh-jjeom-oh-postgres:5432/oh_jjeom_oh
    username: postgres
    password: '1234'
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "https://fivedotfive.co.kr/api/login/oauth2/code/kakao"
            scope: profile_nickname, account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000 # 1시간 (ms)
  refresh-token-expiration: 604800 # 7일 (seconds, Redis용)
