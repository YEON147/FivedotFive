spring:
  application:
    name: oh-jjeom-oh
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5433/oh_jjeom_oh
    username: postgres
    password: '1234'
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: your-very-long-secret-key-that-is-at-least-32-bytes-long-and-secure
  access-token-expiration: 3600000 # 1시간 (ms)
  refresh-token-expiration: 604800 # 7일 (seconds, Redis용)
